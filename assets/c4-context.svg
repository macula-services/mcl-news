<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-label="mcl-news system context">
<title>mcl-news system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="690"/>
<rect class="b-per" x="40" y="30" width="270" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Operator</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Runs it and sets MCL_NEWS_FEEDS,</text>
<text class="t-desc" x="56" y="116">or leaves the built-in</text>
<text class="t-desc" x="56" y="132">broadcaster list in place</text>
<rect class="b-ext" x="365" y="30" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="58">Consumer</text>
<text class="t-type" x="381" y="76">[External system]</text>
<text class="t-desc" x="381" y="100">A mind or an agent subscribed</text>
<text class="t-desc" x="381" y="116">to news_item_reported_v1; the</text>
<text class="t-desc" x="381" y="132">payload names no sender</text>
<rect class="b-ext" x="690" y="30" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="58">News sources</text>
<text class="t-type" x="706" y="76">[External system]</text>
<text class="t-desc" x="706" y="100">France 24, VRT NWS and DW by</text>
<text class="t-desc" x="706" y="116">default: RSS/Atom over HTTPS,</text>
<text class="t-desc" x="706" y="132">and the page for og:image</text>
<rect class="b-sys" x="365" y="186" width="270" height="152" rx="10"/>
<text class="t-name" x="381" y="214">mcl-news</text>
<text class="t-type" x="381" y="232">[mcl_om mesh service]</text>
<text class="t-desc" x="381" y="256">Polls every source every five</text>
<text class="t-desc" x="381" y="272">minutes and reports each item it</text>
<text class="t-desc" x="381" y="288">has not reported before as one fact,</text>
<text class="t-desc" x="381" y="304">news_item_reported_v1. /health is a</text>
<text class="t-desc" x="381" y="320">port, 8498. No procedures, no store</text>
<rect class="b-mac" x="365" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="458">macula-realm</text>
<text class="t-type" x="381" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="500">The trust anchor and the grant:</text>
<text class="t-desc" x="381" y="516">the org mcl-news, scope for 30</text>
<text class="t-desc" x="381" y="532">days, and the boot claim</text>
<rect class="b-mac" x="690" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="458">Macula stations, mesh DHT</text>
<text class="t-type" x="706" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="706" y="500">The pinned dial; the fact goes out</text>
<text class="t-desc" x="706" y="516">through a station, and the DHT</text>
<text class="t-desc" x="706" y="532">holds each advertisement</text>
<path class="edge" d="M175 150V168H400V186" marker-end="url(#a)"/>
<text class="t-rel" x="183" y="160">deploys it, sets</text>
<text class="t-rel" x="183" y="176">the feed list</text>
<path class="edge" d="M560 186V150" marker-end="url(#a)"/>
<text class="t-rel" x="552" y="172" text-anchor="end">one fact per new item</text>
<path class="edge" d="M600 186V168H825V150" marker-end="url(#a)"/>
<text class="t-rel" x="640" y="164">fetches every 5 minutes</text>
<path class="edge" d="M460 338V430" marker-end="url(#a)"/>
<text class="t-rel" x="468" y="384">trust anchor, grant</text>
<path class="edge" d="M620 338V370H825V430" marker-end="url(#a)"/>
<text class="t-rel" x="632" y="364">publishes the fact</text>
<text class="t-desc" x="40" y="596">The sensor offers no procedure and asks the realm for no extra authority: its whole output is one fact, published under</text>
<text class="t-desc" x="40" y="614">its own verified identity. A source's first fetch seeds rather than floods: only its newest item is reported and the</text>
<text class="t-desc" x="40" y="632">rest of the backlog is marked seen. A source being down, or a dark mesh, is deliberately not a health failure.</text>
<rect class="b-sys" x="24" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="662">In scope</text>
<rect class="b-per" x="110.8" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="662">Person</text>
<rect class="b-mac" x="184.39999999999998" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="662">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="662">External system</text>
<rect class="b-cmp" x="490.0" y="650" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="662">Container or component</text>
</svg>
